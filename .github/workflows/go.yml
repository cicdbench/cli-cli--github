name: Unit and Integration Tests
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key-prefix: go-race
      - name: Download dependencies
        run: go mod download
      - name: Run unit and integration tests
        run: go test -count=1 -race -tags=integration ./...
      - name: Build
        run: go build -v ./cmd/gh
      - name: Build with debug overrides
        if: matrix.os == 'ubuntu-latest'
        run: go build -v -tags=ghdebug ./cmd/gh
    timeout-minutes: 30
  integration-tests:
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key-prefix: go
      - name: Build executable
        run: make
      - name: Run attestation command set integration tests
        shell: bash
        run: |
          ./test/integration/attestation-cmd/run-all-tests.sh "${{ matrix.os }}"
    timeout-minutes: 30
